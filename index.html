/* ---------- 認証 ---------- */

/* ---------- プロフィール(プラン・管理者フラグ) ---------- */

/* ---------- エラー分類 ----------
   SQL側で RAISE EXCEPTION 'GAME_LIMIT_REACHED' のように投げたメッセージを、
   supabase-jsはerror.message にそのまま載せて返す。 */
function classifyDbError(error) {
  if (!error) return null;
  const msg = (error.message || "") + " " + (error.details || "");
  if (msg.includes("GAME_LIMIT_REACHED")) return "GAME_LIMIT_REACHED";
  if (msg.includes("RESEARCH_LIMIT_REACHED")) return "RESEARCH_LIMIT_REACHED";
  if (error.code === "23505") return "DUPLICATE"; // unique制約違反(同じstart_time)
  return "UNKNOWN";
}

/* ---------- games ----------
   DBの列名(snake_case)と、アプリ内部で使ってるキー(camelCase)の変換をここで吸収する */
function gameRowToApp(row) {
  return {
    id: row.id,
    startTime: row.start_time,
    sente: row.sente,
    gote: row.gote,
    jikan: row.jikan,
    moveTokens: row.move_tokens,
    movesCount: row.moves_count,
    tktSide: row.tkt_side,
    result: row.result,
    kaikei: row.kaikei,
  };
}
function gameAppToRow(g) {
  return {
    start_time: g.startTime,
    sente: g.sente,
    gote: g.gote,
    jikan: g.jikan,
    move_tokens: g.moveTokens,
    moves_count: g.movesCount,
    tkt_side: g.tktSide,
    result: g.result,
    kaikei: g.kaikei,
  };
}

async function listGames() {
  const sb = getClient();
  const { data, error } = await sb.from("games").select("*").order("start_time", { ascending: true });
  if (error) throw error;
  return data.map(gameRowToApp);
}

/* 1局登録。成功時は {ok:true, row} / 失敗時は {ok:false, kind, error} を返す(例外は投げない) */
async function insertGame(gameApp) {
  const sb = getClient();
  const { data, error } = await sb.from("games").insert(gameAppToRow(gameApp)).select().single();
  if (error) return { ok: false, kind: classifyDbError(error), error };
  return { ok: true, row: gameRowToApp(data) };
}

/* 保存済みの1局の「自分の先後」と「勝敗」だけを書き換える */

}

async function upsertNote(noteKey, { starred, note }) {

/* ---------- researches(サイト2) ---------- */
async function listResearches() {

  if (error) return { ok: false, kind: classifyDbError(error), error };
  return { ok: true };

async function deleteResearch(researchId) {

/* ========= ここまで共通データ層モジュール ========= */

/* =========================================================
   将棋 局面分析ツール - 単体HTML版
   データはすべてブラウザのlocalStorageに保存される(サーバー送信なし)
   ========================================================= */

/* ---------- 定数 ---------- */
const ZEN2INT = {}; "１２３４５６７８９".split("").forEach((c,i)=>ZEN2INT[c]=i+1);
const KAN2INT = {}; "一二三四五六七八九".split("").forEach((c,i)=>KAN2INT[c]=i+1);
const PIECE_CODE = {"歩":"P","香":"L","桂":"N","銀":"S","金":"G","角":"B","飛":"R","玉":"K","王":"K","と":"t","成香":"l","成桂":"n","成銀":"s","馬":"b","龍":"r","竜":"r"};
const CODE_TO_JP = {P:"歩",L:"香",N:"桂",S:"銀",G:"金",B:"角",R:"飛",K:"玉",t:"と",l:"杏",n:"圭",s:"全",b:"馬",r:"龍"};
const PROMOTED_OF_BASE = {"歩":"と","香":"成香","桂":"成桂","銀":"成銀","角":"馬","飛":"龍"};
/* 盤の表示だけ、成香・成桂・成銀を1文字にする(2文字だとマスが縦に伸びるため) */
const DISP_PIECE = {"成香":"杏","成桂":"圭","成銀":"全"};
function dispPiece(n) { return DISP_PIECE[n] || n; }
const BASE_OF_PROMOTED = {"と":"歩","成香":"香","成桂":"桂","成銀":"銀","馬":"角","龍":"飛","竜":"飛"};
const HAND_ORDER = ["R","B","G","S","N","L","P"];
const FILES = [9,8,7,6,5,4,3,2,1];
const RANKS = ["一","二","三","四","五","六","七","八","九"];
const KAIKEI_HINTS = ["対矢倉","対雁木","相掛かり","横歩取り","角換わり45桂馬","角換わり相腰掛け銀","角換わり相早繰り銀",
  "対角換わり早繰り銀","対角換わり棒銀","対角換わり45桂","対筋違い角","対嬉野流","四間飛車対穴熊","四間飛車対棒銀",
  "四間飛車対位取り","四間飛車対ミレニアム","四間飛車対45歩","四間飛車対その他","kkf","対向い飛車","対kkf",
  "対三間飛車急戦","対三間飛車持久戦","対四間飛車急戦","対四間飛車持久戦","対中飛車急戦","対中飛車持久戦"];

const MOVE_RE = /^([１２３４５６７８９])([一二三四五六七八九])(成香|成桂|成銀|歩|香|桂|銀|金|角|飛|玉|王|と|馬|龍|竜)(成)?(打)?(?:\((\d)(\d)\))?$/;

/* ---------- localStorage helpers ----------
   棋譜(games)とメモ(notes)はDB管理に移行したため、ここでは
   端末ごとの設定であるMYNAMES(自分の将棋ウォーズID)だけ引き続きローカル保存する。 */
const LS_MYNAMES = "shogi_tool_mynames";
function loadMyNames() { try { return JSON.parse(localStorage.getItem(LS_MYNAMES)) || []; } catch(e) { return []; } }
function saveMyNames(names) { localStorage.setItem(LS_MYNAMES, JSON.stringify(names)); }

/* ---------- 棋譜パーサー ---------- */
function parseMoveToken(tok) {
  const m = MOVE_RE.exec(tok);
  if (!m) return null;
  const col = ZEN2INT[m[1]];
  const row = KAN2INT[m[2]];
  const piece = m[3];
  const promote = !!m[4];
  const drop = !!m[5];
  const from = m[6] ? [parseInt(m[6],10), parseInt(m[7],10)] : null;
  return { to: [col,row], piece, promote, drop, from };
}

function initialBoard() {
  const board = {};
  const back = ["香","桂","銀","金","玉","金","銀","桂","香"];
  for (let i=0;i<9;i++) {
    const col = i+1;
    board[col+","+1] = ["G", back[i]];
    board[col+","+9] = ["S", back[i]];
  }
  board["8,2"] = ["G","飛"];
  board["2,2"] = ["G","角"];
  board["2,8"] = ["S","飛"];
  board["8,8"] = ["S","角"];
  for (let col=1; col<=9; col++) {
    board[col+",3"] = ["G","歩"];
    board[col+",7"] = ["S","歩"];
  }
  return board;
}

function cloneBoard(board) { const b={}; for (const k in board) b[k]=board[k].slice(); return b; }
function cloneHands(hands) { return { S: Object.assign({},hands.S), G: Object.assign({},hands.G) }; }

function encodeState(board, hands, turn) {
  // 81*2文字の盤面文字列 + 持ち駒 + 手番
  let s = "";
  for (let r=1;r<=9;r++) {
    for (let c=1;c<=9;c++) {
      const cell = board[c+","+r];
      if (!cell) { s += ".."; }
      else { s += cell[0] + PIECE_CODE[cell[1]]; }
    }
  }
  const handStr = (h) => HAND_ORDER.filter(k=>h[k]).map(k=>k+h[k]).join(",");
  return s + "|" + handStr(hands.S) + "|" + handStr(hands.G) + "|" + turn;
}

function applyMove(board, hands, turn, mv) {
  const opp = turn === "S" ? "G" : "S";
  const toKey = mv.to[0] + "," + mv.to[1];
  if (mv.drop) {
    const code = PIECE_CODE[mv.piece];
    hands[turn][code] = (hands[turn][code]||0) - 1;
    if (hands[turn][code] <= 0) delete hands[turn][code];
    board[toKey] = [turn, mv.piece];
  } else {
    const fromKey = mv.from[0] + "," + mv.from[1];
    if (board[toKey]) {
      const cap = board[toKey][1];
      const base = BASE_OF_PROMOTED[cap] || cap;
      const code = PIECE_CODE[base];
      hands[turn][code] = (hands[turn][code]||0) + 1;
      delete board[toKey];
    }
    delete board[fromKey];
    // 「成」の手は、盤上の駒を成駒に入れ替える(すでに成駒の駒の動きはそのまま)
    board[toKey] = [turn, mv.promote ? (PROMOTED_OF_BASE[mv.piece] || mv.piece) : mv.piece];
  }
}

function simulateGame(moveTokens) {
  let board = initialBoard();
  let hands = { S:{}, G:{} };
  let turn = "S";
  const trace = [];
  for (const tok of moveTokens) {
    const mv = parseMoveToken(tok);
    if (!mv) continue;
    const before = encodeState(board, hands, turn);
    const snap = { board: cloneBoard(board), hands: cloneHands(hands), turn };
    trace.push({ before, move: tok, side: turn, snap });
    applyMove(board, hands, turn, mv);
    turn = turn === "S" ? "G" : "S";
  }
  return trace;
}

/* ---------- 棋譜テキストのヘッダー抽出・分割 ---------- */
function splitBlocks(rawText) {
  const parts = rawText.split(/(?=開始日時[:：])/).map(s=>s.trim()).filter(Boolean);
  return parts.filter(p => /開始日時[:：]/.test(p));
}

function extractField(text, label) {
  const re = new RegExp(label + "[:：]\\s*(\\S+)");
  const m = re.exec(text);
  return m ? m[1] : null;
}

function parseBlock(text) {
  const startTimeMatch = /開始日時[:：]\s*(\S+\s+\S+)/.exec(text);
  const startTime = startTimeMatch ? startTimeMatch[1] : null;
  const sente = extractField(text, "先手");
  const gote = extractField(text, "後手");
  let jikanRaw = extractField(text, "持ち時間");
  let jikan = jikanRaw;
  if (jikanRaw === "0分") {
    const byoyomi = extractField(text, "秒読み");
    if (byoyomi) jikan = "0分秒読み" + byoyomi;
  }
  // 指し手行の抽出: "N 指し手  (時間)" 形式。投了/中断/千日手等で終端。
  const lines = text.split("\n").map(l=>l.trim()).filter(Boolean);
  const moveTokens = [];
  let resignMoveNum = null;
  let endReason = null;
  const lineRe = /^(\d+)\s+(\S+)\s*(?:\(|$)/;
  for (const line of lines) {
    const m = lineRe.exec(line);
    if (!m) continue;
    const num = parseInt(m[1],10);
    const tok = m[2];
    if (tok === "投了" || tok === "中断" || tok === "千日手" || tok === "持将棋" || tok === "切れ負け") {
      resignMoveNum = num;
      endReason = tok;
      break;
    }
    moveTokens.push(tok);
  }
  return { startTime, sente, gote, jikan, moveTokens, resignMoveNum, endReason };
}

/* ---------- 勝敗・手番の判定 ---------- */
function computeResult(parsed, myNames) {
  const isMe = (name) => myNames.some(n => n && n.trim() === (name||"").trim());
  let tktSide = null;
  if (isMe(parsed.sente)) tktSide = "S";
  else if (isMe(parsed.gote)) tktSide = "G";
  let result = null;
  if (tktSide && parsed.resignMoveNum != null && parsed.endReason === "投了") {
    const senteResigned = (parsed.resignMoveNum % 2 === 1); // 奇数手=先手番の投了
    if (tktSide === "S") result = senteResigned ? "lose" : "win";
    else result = senteResigned ? "win" : "lose";
  }
  return { tktSide, result };
}

/* ---------- ツリー構築 ---------- */
function parseStartTimeToDate(startTime) {
  if (!startTime) return null;
  const m = /^(\d{4})\/(\d{1,2})\/(\d{1,2})\s+(\d{1,2}):(\d{1,2}):(\d{1,2})/.exec(startTime);
  if (!m) return null;
  return new Date(Number(m[1]), Number(m[2])-1, Number(m[3]), Number(m[4]), Number(m[5]), Number(m[6]));
}

function buildTrees() {
  const trees = { S: { root: null, nodes: {} }, G: { root: null, nodes: {} } };
  let rootHash = null;
  const now = new Date();
  const oneMonthAgo = new Date(now.getTime() - 30*24*60*60*1000);
  for (const g of GAMES) {
    if (!g.tktSide) continue;
    const trace = simulateGame(g.moveTokens);
    if (trace.length === 0) continue;
    if (rootHash === null) rootHash = trace[0].before;
    const tree = trees[g.tktSide];
    if (!tree.root) tree.root = trace[0].before;
    const win = g.result === "win" ? 1 : 0;
    const lose = g.result === "lose" ? 1 : 0;
    const gDate = parseStartTimeToDate(g.startTime);
    const isRecent = gDate && gDate >= oneMonthAgo;
    for (let i=0;i<trace.length;i++) {
      const step = trace[i];
      if (!tree.nodes[step.before]) tree.nodes[step.before] = { edges: {}, snap: step.snap };
      const node = tree.nodes[step.before];
      if (!node.edges[step.move]) node.edges[step.move] = { n:0, w:0, recentN:0, side: step.side, to: null, ply: i+1 };
      const e = node.edges[step.move];
      e.n += 1; e.w += win;
      if (isRecent) e.recentN += 1;
      if (i+1 < trace.length) e.to = trace[i+1].before;
    }
  }
  // 両ツリーとも同一の開始局面をルートにする
  if (rootHash) {
    for (const key of ["S","G"]) {
      if (!trees[key].root) trees[key].root = rootHash;
      if (!trees[key].nodes[rootHash]) {
        const board = initialBoard();
        trees[key].nodes[rootHash] = { edges: {}, snap: { board, hands:{S:{},G:{}}, turn:"S" } };
      }
    }
  }
  return trees;
}

/* ---------- 頻出局面ランキング ----------
   「一番後ろ」の局面だけを拾う: 同じ条件(minCount局以上)を満たす手が、その先にもう無い局面。
   hash は手を指した「後」の局面(=ここから先で分かれていく局面)。 */
function computeRanking(trees, sk, opt) {
  const tree = trees[sk];
  const key = opt.sort === "recent" ? "recentN" : "n";
  const all = [];
  for (const hash in tree.nodes) {
    const node = tree.nodes[hash];
    for (const move in node.edges) {
      const e = node.edges[move];
      all.push({ hash, move, n:e.n, w:e.w, recentN:e.recentN, rate: e.n>0?(e.w/e.n):0, ply:e.ply, to:e.to });
    }
  }
  const list = all.filter(e => {
    if (e[key] < opt.minCount) return false;
    if (e.ply < opt.minPly) return false;
    if (!e.to) return true;
    const next = tree.nodes[e.to];
    if (!next) return true;
    return !Object.values(next.edges).some(x => x[key] >= opt.minCount);
  }).map(e => Object.assign({}, e, { hash: e.to || e.hash }));
  const cmp = {
    deep:   (a,b)=> b.ply-a.ply || b.n-a.n,
    count:  (a,b)=> b.n-a.n || b.ply-a.ply,
    recent: (a,b)=> b.recentN-a.recentN || b.ply-a.ply,
    best:   (a,b)=> b.rate-a.rate || b.n-a.n || b.ply-a.ply,
    worst:  (a,b)=> a.rate-b.rate || b.n-a.n || b.ply-a.ply
  }[opt.sort] || ((a,b)=>b.ply-a.ply);
  return list.sort(cmp);
}

/* ---------- 分岐点ジャンプ ----------
   最多の手が threshold% 以上かつ2局以上通った間は進み続け、分かれる局面で止まる */
const LS_JUMP_TH = "shogi_jump_threshold", LS_JUMP_AUTO = "shogi_jump_auto";
function getJumpThreshold() {
  try { const v = parseInt(localStorage.getItem(LS_JUMP_TH),10); if (v>=50 && v<=100) return v; } catch(e) {}
  return 80;
}
function getJumpAuto() {
  try { return localStorage.getItem(LS_JUMP_AUTO) !== "0"; } catch(e) { return true; }
}
function advanceToBranch(tree, path, threshold) {
  let cur = path.length ? path[path.length-1].hash : tree.root;
  const seen = new Set([cur]);
  let out = path.slice();
  for (let i=0;i<300;i++) {
    const node = tree.nodes[cur];
    if (!node) break;
    const ents = Object.entries(node.edges);
    if (!ents.length) break;
    const total = ents.reduce((t,[,e])=>t+e.n,0);
    ents.sort((a,b)=>b[1].n-a[1].n);
    const [mv, e] = ents[0];
    if (total < 2 || !e.to || seen.has(e.to)) break;
    if (e.n/total*100 < threshold) break;
    seen.add(e.to);
    out = out.concat([{ move: mv, hash: e.to }]);
    cur = e.to;
  }
  return out;
}

function bfsPath(tree, targetHash) {
  if (targetHash === tree.root) return [];
  const visited = new Set([tree.root]);
  const queue = [{ hash: tree.root, path: [] }];
  while (queue.length) {
    const { hash, path } = queue.shift();
    const node = tree.nodes[hash];
    if (!node) continue;
    for (const move in node.edges) {
      const e = node.edges[move];
      if (!e.to || visited.has(e.to)) continue;
      const newPath = path.concat([{ move, hash: e.to }]);
      if (e.to === targetHash) return newPath;
      visited.add(e.to);
      queue.push({ hash: e.to, path: newPath });
    }
  }
  return null;
}

  if (!trees[RANK.side].root) {
    el.innerHTML = `<div class="small">まだ有効な棋譜データがない。「棋譜を追加」タブから登録してほしい。</div>`;
    return;
  }
  const minCount = RANK.minCount != null ? RANK.minCount : rankDefaultMin(RANK.sort);
  const list = computeRanking(trees, RANK.side, { sort:RANK.sort, minCount, minPly:RANK.minPly });
  let html = `<div class="row" style="margin-bottom:10px;">
    <button class="${RANK.side==='S'?'':'secondary'}" id="rkS">先手</button>
    <button class="${RANK.side==='G'?'':'secondary'}" id="rkG">後手</button>
  </div><div class="row" style="margin-bottom:10px;">`;
  RANK_SORTS.forEach(([k,l]) => html += `<button class="${RANK.sort===k?'':'secondary'}" data-rksort="${k}" style="padding:4px 10px; font-size:12px;">${l}</button>`);
  html += `</div><div class="row" style="margin-bottom:12px;">
    <label style="display:inline; margin:0;">最小局数<input type="number" id="rkMinCount" value="${minCount}" min="1" style="width:60px; display:inline-block;" onfocus="this.select()"></label>
    <label style="display:inline; margin:0;">最小手数<input type="number" id="rkMinPly" value="${RANK.minPly}" min="0" style="width:60px; display:inline-block;" onfocus="this.select()"></label>
  </div>
  <div class="small" style="margin-bottom:8px;">同じ進行が最小局数以上あり、その先でさらに分かれる(=一番後ろの)局面だけを表示。タップでツリーへ移動。</div>`;
  if (!list.length) html += `<div class="small" style="color:var(--sub);">該当なし(条件をゆるめてみてほしい)</div>`;
  list.slice(0, RANK.shown).forEach((item, i) => {
    const p = bfsPath(trees[RANK.side], item.hash) || [];
    const tail = p.slice(-4).map(x=>x.move).join(" ");
    const stat = RANK.sort==="recent" ? `直近${item.recentN}局 / 全${item.n}局` : `${item.n}局 勝率${Math.round(item.rate*100)}%(${item.w}勝${item.n-item.w}敗)`;
    html += `<div class="edge-item" data-rkhash="${item.hash}">
      <span class="edge-move">${i+1}. ${item.ply}手目まで</span>
      <span class="small">${stat}<br>${p.length>4?"… ":""}${tail}</span>
    </div>`;
  });
  if (list.length > RANK.shown) html += `<div style="margin-top:8px;"><button class="secondary" id="rkMore">もっと見る(残り${list.length-RANK.shown}件)</button></div>`;
  el.innerHTML = html;
  document.getElementById("rkS").onclick = () => { RANK.side="S"; RANK.shown=10; renderRankingTab(); };
  document.getElementById("rkG").onclick = () => { RANK.side="G"; RANK.shown=10; renderRankingTab(); };
  el.querySelectorAll("[data-rksort]").forEach(b => b.onclick = () => { RANK.sort=b.dataset.rksort; RANK.minCount=null; RANK.shown=10; renderRankingTab(); });
  document.getElementById("rkMinCount").onchange = (e) => { RANK.minCount = Math.max(1, parseInt(e.target.value,10)||1); RANK.shown=10; renderRankingTab(); };
  document.getElementById("rkMinPly").onchange = (e) => { RANK.minPly = Math.max(0, parseInt(e.target.value,10)||0); RANK.shown=10; renderRankingTab(); };
  const more = document.getElementById("rkMore");
  if (more) more.onclick = () => { RANK.shown += 10; renderRankingTab(); };
  el.querySelectorAll("[data-rkhash]").forEach(item => item.onclick = () => jumpTo(RANK.side, item.dataset.rkhash));
}

/* ---------- タブ: 局面検索 ---------- */
function renderSearchTab() {
  const el = document.getElementById("panel-search");
  el.innerHTML = `
    <div class="row" style="margin-bottom:16px;">
      <select id="searchTreeSel">
        <option value="both">両ツリー</option>
        <option value="S">先手ツリー</option>
        <option value="G">後手ツリー</option>
      </select>
      <label style="display:inline; margin:0;">局数<input type="number" id="searchMinN" value="2" min="1" style="width:60px; display:inline-block;" onfocus="this.select()">局以上</label>
      <select id="searchRateOp">
        <option value="gte">勝率 以上</option>
        <option value="lt">勝率 未満</option>
      </select>
      <input type="number" id="searchRateVal" placeholder="未指定" min="0" max="100" style="width:70px;" onfocus="this.select()">%
      <button id="btnSearch">検索</button>
    </div>
    <div id="searchResults" class="small">条件を指定して検索してほしい。</div>
  `;
  document.getElementById("btnSearch").onclick = () => {
    const trees = buildTrees();
    const treeSel = document.getElementById("searchTreeSel").value;
    const minN = parseInt(document.getElementById("searchMinN").value,10) || 1;
    const rateOp = document.getElementById("searchRateOp").value;
    const rateValRaw = document.getElementById("searchRateVal").value;
    const rateVal = rateValRaw === "" ? null : parseInt(rateValRaw,10);
    const sides = treeSel === "both" ? ["S","G"] : [treeSel];
    const results = [];
    sides.forEach(sk => {
      const tree = trees[sk];
      for (const hash in tree.nodes) {
        const node = tree.nodes[hash];
        for (const move in node.edges) {
          const e = node.edges[move];
          if (e.n < minN) continue;
          const rate = e.n>0 ? (e.w/e.n)*100 : 0;
          if (rateVal !== null) {
            if (rateOp==="gte" && rate<rateVal) continue;
            if (rateOp==="lt" && rate>=rateVal) continue;
          }
          results.push({ sk, hash, move, n:e.n, w:e.w, rate:Math.round(rate), mover:e.side });
        }
      }
    });
    results.sort((a,b)=> b.n-a.n || b.rate-a.rate);
    const box = document.getElementById("searchResults");
    if (results.length===0) { box.innerHTML = `<div class="small">該当なし。</div>`; return; }
    let html = `<div class="small" style="margin-bottom:8px;">${results.length}件ヒット(最大100件表示)</div>`;
    results.slice(0,100).forEach((r,i) => {
      html += `<div class="edge-item" data-sk="${r.sk}" data-hash="${r.hash}">
        <span><span class="small" style="margin-right:8px;">${r.sk==='S'?'先手ツリー':'後手ツリー'} / ${r.mover==='S'?'先手が指す':'後手が指す'}</span><span class="edge-move">${r.move}</span></span>
        <span class="edge-stat">${r.n}局 勝率${r.rate}%（${r.w}勝${r.n-r.w}敗）</span>
      </div>`;
    });
    box.innerHTML = html;
    box.querySelectorAll(".edge-item").forEach(item => {
      item.onclick = () => jumpTo(item.dataset.sk, item.dataset.hash);
    });
  };
}

let SKIP_AUTO_BRANCH = false;
function jumpTo(sk, hash) {
  const trees = buildTrees();
  const p = bfsPath(trees[sk], hash);
  treeSide = sk;
  treePath = p || [];
  SKIP_AUTO_BRANCH = true;
  switchTab("tree");
}

/* ---------- タブ: 成績ダッシュボード ---------- */
function renderDashboardTab() {
  const el = document.getElementById("panel-dash");
  const rows = GAMES.filter(g => g.tktSide && g.result);
  if (rows.length===0) {
    el.innerHTML = `<div class="small">まだ判定済みの棋譜データがない。</div>`;
    return;
  }
  const groupBy = (keyFn) => {
    const m = {};
    rows.forEach(r => {
      const k = keyFn(r);
      if (!m[k]) m[k] = {n:0,w:0};
      m[k].n += 1;
      if (r.result==="win") m[k].w += 1;
    });
    return m;
  };
  const byKaikei = groupBy(r=>r.kaikei||"(未分類)");
  const bySide = groupBy(r=>r.tktSide==="S"?"先手":"後手");
  const byJikan = groupBy(r=>r.jikan||"(不明)");
  const totalW = rows.filter(r=>r.result==="win").length;
  const totalN = rows.length;

  const barRow = (label, n, w) => {
    const rate = n>0 ? Math.round((w/n)*100) : 0;
    return `<div style="margin-bottom:8px;">
      <div class="row" style="justify-content:space-between; font-size:12px; margin-bottom:2px;">
        <span style="font-weight:600;">${label}</span>
        <span class="small">${w}勝${n-w}敗 (${rate}%) / ${n}局</span>
      </div>
      <div class="bar-bg"><div class="bar-fill" style="width:${rate}%;"></div></div>
    </div>`;
  };

  let html = "";
  html += `<div class="card" style="display:inline-block;">
    <div class="small">総合成績</div>
    <div style="font-size:22px; font-weight:800;">${totalW}勝${totalN-totalW}敗</div>
    <div class="small">勝率 ${Math.round((totalW/totalN)*100)}%</div>
  </div>`;
  html += `<div class="flex-gap">`;
  html += `<div style="flex:1; min-width:260px;"><div style="font-weight:700; margin-bottom:8px;">戦型別</div>`;
  Object.entries(byKaikei).sort((a,b)=>b[1].n-a[1].n).forEach(([k,v])=> html += barRow(k,v.n,v.w));
  html += `</div>`;
  html += `<div style="flex:1; min-width:260px;"><div style="font-weight:700; margin-bottom:8px;">先後別</div>`;
  Object.entries(bySide).forEach(([k,v])=> html += barRow(k,v.n,v.w));
  html += `<div style="font-weight:700; margin-top:16px; margin-bottom:8px;">持ち時間別</div>`;
  Object.entries(byJikan).forEach(([k,v])=> html += barRow(k,v.n,v.w));
  html += `</div></div>`;

  html += `<div style="margin-top:24px;"><div style="font-weight:700; margin-bottom:8px;">対局一覧</div>`;
  html += `<div style="overflow-x:auto;"><table class="data"><thead><tr>
    <th>日時</th><th>先後</th><th>相手</th><th>戦型</th><th>持ち時間</th><th>結果</th><th></th>
  </tr></thead><tbody>`;
  GAMES.forEach(r => {
    const resultLabel = r.result==="win" ? "勝ち" : r.result==="lose" ? "負け" : "不明";
    const resultColor = r.result==="win" ? "var(--win)" : r.result==="lose" ? "var(--lose)" : "#999";
    const opponent = r.tktSide==="S" ? r.gote : r.tktSide==="G" ? r.sente : (r.sente+"/"+r.gote);
    html += `<tr>
      <td>${r.startTime||""}</td>
      <td>${r.tktSide==="S"?"先手":r.tktSide==="G"?"後手":"?"}</td>
      <td>${opponent}</td>
      <td>${r.kaikei||""}</td>
      <td>${r.jikan||""}</td>
      <td style="color:${resultColor}; font-weight:700;">${resultLabel}</td>
      <td><button class="secondary" data-delid="${r.id}" style="padding:2px 8px; font-size:11px;">削除</button></td>
    </tr>`;
  });
  html += `</tbody></table></div></div>`;
  el.innerHTML = html;
  el.querySelectorAll("[data-delid]").forEach(btn => {
    btn.onclick = async () => {
      if (!confirm("この対局データを削除する?")) return;
      try { await deleteGame(btn.dataset.delid); }
      catch (e) { alert("削除に失敗した: " + e.message); return; }
      GAMES = GAMES.filter(g => String(g.id) !== btn.dataset.delid);
      renderDashboardTab();
      updateSummaryLine();
    };
  });
}

/* ---------- タブ: 設定 ---------- */
function renderSettingsTab() {
  const el = document.getElementById("panel-settings");
  el.innerHTML = `
    <div class="card">
      <label>自分の将棋ウォーズID(複数アカウントある場合はカンマ区切りで全部入力)</label>
      <input type="text" id="myNamesInput" value="${MYNAMES.join(", ")}" placeholder="例: TKTDESUYO, TKTdao, issy1484">
      <div class="hint">ここに登録した名前が「先手」または「後手」に出てきた対局を、自分の対局として自動集計する。</div>
      <div style="margin-top:10px;"><button id="btnSaveNames">保存</button></div>
    </div>
    <div class="card">
      <div class="small" style="margin-bottom:8px;">分岐点ジャンプ</div>
      <label style="display:inline; margin:0;">最多の手の割合が <input type="number" id="jumpTh" value="${getJumpThreshold()}" min="50" max="100" style="width:70px; display:inline-block;"> % 以上の間は自動で進む</label>
      <div style="margin-top:8px;"><label style="display:inline; margin:0;"><input type="checkbox" id="jumpAuto" ${getJumpAuto()?"checked":""} style="width:auto; display:inline-block;"> 局面ツリーを開いた時(開始局面にいる場合)に自動で分岐点まで進む</label></div>
      <div class="hint">2局以上通った局面のみ対象。このブラウザに保存される。</div>
      <div style="margin-top:8px;"><button id="btnSaveJump">保存</button></div>
    </div>
    <div class="card">
      <div class="small" style="margin-bottom:8px;">データの管理</div>
      <div class="row">
        <button class="secondary" id="btnExport">全データをJSONで書き出す</button>
        <button class="secondary" id="btnImportJson">JSONから読み込む</button>
        <input type="file" id="fileInput" accept="application/json" style="display:none;">
      </div>
      <div class="hint">端末やブラウザを変える時は、書き出したJSONファイルを新しい環境で読み込めばデータを引き継げる。</div>
    </div>
    <div class="card">
      <div class="small" style="margin-bottom:8px;">保存済みの対局の先後・勝敗を再判定</div>
      <div class="hint" style="margin-bottom:8px;">自分のIDを登録する前に取り込んだ対局(先後が「?」の対局)を、上で登録したIDで判定し直す。先後がすでに分かっている対局は変更しない。投了で終わった対局として勝敗を付けるため、千日手・中断で終わった対局は、勝敗が正しくならない場合がある。</div>
      <button class="secondary" id="btnRejudge">先後・勝敗を再判定する</button>
      <div id="rejudgeResult" style="margin-top:10px;"></div>
    </div>
    <div class="card">
      <div class="small" style="margin-bottom:8px;">重複データのチェック</div>
      <div class="hint" style="margin-bottom:8px;">開始日時が完全に一致する対局が複数登録されていないか確認する。過去に同じ棋譜を2回貼り付けてしまった場合などに使う。</div>
      <button class="secondary" id="btnCheckDup">重複をチェックする</button>
      <div id="dupResult" style="margin-top:10px;"></div>
    </div>
  `;
  document.getElementById("btnSaveNames").onclick = () => {
    MYNAMES = document.getElementById("myNamesInput").value.split(",").map(s=>s.trim()).filter(Boolean);
    saveMyNames(MYNAMES);
    alert("保存した。");
    updateSummaryLine();
  };
  document.getElementById("btnSaveJump").onclick = () => {
    const v = Math.min(100, Math.max(50, parseInt(document.getElementById("jumpTh").value,10) || 80));
    try {
      localStorage.setItem(LS_JUMP_TH, String(v));
      localStorage.setItem(LS_JUMP_AUTO, document.getElementById("jumpAuto").checked ? "1" : "0");
    } catch(e) {}
    alert("保存した。");
    renderSettingsTab();
  };
  document.getElementById("btnExport").onclick = exportBackupJSON;
  document.getElementById("btnImportJson").onclick = () => document.getElementById("fileInput").click();
  document.getElementById("fileInput").onchange = (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = async () => {
      let data;
      try { data = JSON.parse(reader.result); }
      catch (err) { alert("読み込みに失敗した: " + err.message); return; }

      if (data.myNames) { MYNAMES = data.myNames; saveMyNames(MYNAMES); }

      let added = 0, skippedDup = 0, limitHit = 0;
      if (data.games) {
        const existingTimes = new Set(GAMES.map(g => g.startTime));
        for (const g of data.games) {
          if (existingTimes.has(g.startTime)) { skippedDup++; continue; }
          const res = await insertGame(g);
          if (res.ok) { GAMES.push(res.row); existingTimes.add(g.startTime); added++; }
          else if (res.kind === "GAME_LIMIT_REACHED") { limitHit = data.games.length - added - skippedDup; break; }
          else if (res.kind === "DUPLICATE") { skippedDup++; }
        }
      }
      if (data.notes) {
        for (const key in data.notes) {
          try { await upsertNote(key, data.notes[key]); NOTES[key] = data.notes[key]; } catch(e) {}
        }
      }
      let msg = `${added}局を取り込んだ。`;
      if (skippedDup) msg += `(重複${skippedDup}件はスキップ)`;
      if (limitHit > 0) msg += ` 無料プランの上限(30局)のため、残り${limitHit}局は取り込めなかった。元のJSONファイルはそのまま保管しておき、有料プランに切り替えた後にもう一度読み込めば続きを取り込める。`;
      alert(msg);
      updateSummaryLine();
      renderSettingsTab();
    };
    reader.readAsText(file);
  };

  document.getElementById("btnRejudge").onclick = async () => {
    const box = document.getElementById("rejudgeResult");
    if (!MYNAMES.length) { box.innerHTML = `<div class="warn">先に上の欄に自分の将棋ウォーズIDを入力して「保存」を押してほしい。</div>`; return; }
    const plan = [];
    GAMES.forEach(g => {
      if (g.tktSide) return;
      const r = computeResult({ sente: g.sente, gote: g.gote, resignMoveNum: (g.moveTokens || []).length + 1, endReason: "投了" }, MYNAMES);
      if (r.tktSide) plan.push({ g, tktSide: r.tktSide, result: r.result });
    });
    if (!plan.length) { box.innerHTML = `<div class="tip">再判定の対象になる対局は無かった(先後が「?」の対局のうち、登録したIDが出てくるものが無い)。</div>`; return; }
    const wins = plan.filter(x => x.result === "win").length, loses = plan.filter(x => x.result === "lose").length;
    if (!confirm(`${plan.length}局の先後を判定し直す(勝ち${wins}・負け${loses}・勝敗なし${plan.length - wins - loses})。よろしいか?`)) return;
    let ok = 0, ng = 0;
    for (const x of plan) {
      try { await updateGameJudge(x.g.id, x.tktSide, x.result); x.g.tktSide = x.tktSide; x.g.result = x.result; ok++; }
      catch (e) { ng++; }
    }
    box.innerHTML = `<div class="tip">${ok}局を更新した。${ng ? ng + "局は更新に失敗した。" : ""}</div>`;
    updateSummaryLine();
  };

  document.getElementById("btnCheckDup").onclick = () => {
    const groups = {};
    GAMES.forEach(g => {
      const key = g.startTime || "(日時不明)";
      if (!groups[key]) groups[key] = [];
      groups[key].push(g);
    });
    const dupGroups = Object.entries(groups).filter(([, list]) => list.length > 1);
    const box = document.getElementById("dupResult");
    if (dupGroups.length === 0) {
      box.innerHTML = `<div class="tip">重複は見つからなかった。</div>`;
      return;
    }
    let html = `<div class="warn">${dupGroups.length}件の開始日時で重複が見つかった。それぞれ1件だけ残して削除できる。</div>`;
    dupGroups.forEach(([key, list]) => {
      html += `<div class="edge-item" style="flex-direction:column; align-items:flex-start; cursor:default;">
        <div class="small" style="font-weight:700;">${key} ｜ ${list[0].sente||"?"} vs ${list[0].gote||"?"} ｜ ${list.length}件重複</div>
        <button class="secondary" data-dupkey="${key}" style="margin-top:6px; padding:4px 10px; font-size:11px;">最初の1件だけ残して削除</button>
      </div>`;
    });
    box.innerHTML = html;
    box.querySelectorAll("[data-dupkey]").forEach(btn => {
      btn.onclick = async () => {
        const key = btn.dataset.dupkey;
        if (!confirm(`「${key}」の重複分を削除する（1件だけ残す）。よろしいか?`)) return;
        let kept = false;
        const toDelete = [];
        GAMES = GAMES.filter(g => {
          const k = g.startTime || "(日時不明)";
          if (k !== key) return true;
          if (!kept) { kept = true; return true; }
          toDelete.push(g.id);
          return false;
        });
        for (const id of toDelete) {
          try { await deleteGame(id); } catch (e) { alert("削除に失敗した: " + e.message); }
        }
        updateSummaryLine();
        document.getElementById("btnCheckDup").click();
      };
    });
  };
}

/* ---------- 共通 ---------- */
function updateSummaryLine() {
  const el = document.getElementById("summaryLine");
  const rows = GAMES.filter(g=>g.tktSide && g.result);
  const w = rows.filter(g=>g.result==="win").length;
  let planLabel = "";
  if (CURRENT_PROFILE) {
    if (CURRENT_PROFILE.is_admin || CURRENT_PROFILE.plan === "pro") {
      planLabel = " ｜ 無制限プラン";
    } else {
      const remainSlots = Math.max(0, 30 - GAMES.length);
      planLabel = ` ｜ 無料プラン(あと${remainSlots}局まで保存可能)`;
    }
  }
  el.textContent = `登録局数: ${GAMES.length}局${rows.length ? `（${w}勝${rows.length-w}敗）` : ""}${planLabel}`;
}

function switchTab(name) {
  document.querySelectorAll(".tab").forEach(t => t.classList.toggle("active", t.dataset.tab===name));
  document.querySelectorAll(".panel").forEach(p => p.classList.toggle("active", p.id==="panel-"+name));
  if (name==="import") renderImportTab();
  if (name==="tree") {
    if (!SKIP_AUTO_BRANCH && treePath.length===0 && getJumpAuto()) {
      const t = buildTrees()[treeSide];
      if (t.root) treePath = advanceToBranch(t, [], getJumpThreshold());
    }
    SKIP_AUTO_BRANCH = false;
    renderTreeTab();
  }
  if (name==="ranking") renderRankingTab();
  if (name==="search") renderSearchTab();
  if (name==="bookmarks") renderBookmarksTab();
  if (name==="dash") renderDashboardTab();
  if (name==="settings") renderSettingsTab();
}

document.querySelectorAll(".tab").forEach(t => {
  t.onclick = () => switchTab(t.dataset.tab);
});

/* ---------- 認証ゲート ---------- */
let CURRENT_USER = null;
let CURRENT_PROFILE = null;

function renderLoginScreen() {
  document.getElementById("appContainer").style.display = "none";
  const gate = document.getElementById("authGate");
  gate.style.display = "block";
  document.getElementById("authGateCard").innerHTML = `
    <div class="small" style="margin-bottom:10px;">Googleアカウントでログインして使う。</div>
    <button id="btnGoogleLogin">Googleでログイン</button>
  `;
  document.getElementById("btnGoogleLogin").onclick = async () => {
    try { await signInWithGoogle(); }
    catch (e) { alert("ログインに失敗した: " + e.message); }
  };
}

function renderAuthErrorScreen(message) {
  document.getElementById("appContainer").style.display = "none";
  const gate = document.getElementById("authGate");
  gate.style.display = "block";
  document.getElementById("authGateCard").innerHTML = `<div class="warn">${message}</div>`;
}

async function initApp() {
  let session;
  try { session = await getSession(); }
  catch (e) { renderAuthErrorScreen("認証状態の確認に失敗した: " + e.message); return; }

  if (!session) {
    renderLoginScreen();
    onAuthChange((s) => { if (s) location.reload(); });
    return;
  }

  document.getElementById("authGate").style.display = "none";
  document.getElementById("appContainer").style.display = "block";
  document.getElementById("userEmailLabel").textContent = session.user.email || "";
  document.getElementById("btnSignOut").onclick = async () => {
    await signOut();
    location.reload();
  };

  try {
    CURRENT_USER = session.user;
    CURRENT_PROFILE = await getProfile();
    GAMES = await listGames();
    NOTES = await listNotes();
  } catch (e) {
    renderAuthErrorScreen("データの読み込みに失敗した: " + e.message);
    return;
  }

  updateSummaryLine();
  renderImportTab();
}

initApp();
</script>
