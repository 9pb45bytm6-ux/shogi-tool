<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>将棋 局面分析ツール</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@600;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #fbf6ea;
    --panel: #fdf6e6;
    --border: #e3d3a8;
    --ink: #3a2e18;
    --sub: #8a7a5c;
    --accent: #8a6d3b;
    --board-bg: #f2dcae;
    --board-line: #a98d5c;
    --win: #3d6b2e;
    --lose: #8a2e2e;
  }
  * { box-sizing: border-box; }
  body {
    font-family: system-ui, -apple-system, "Hiragino Kaku Gothic ProN", sans-serif;
    background: linear-gradient(175deg, #f8f3e7 0%, #f1e7d2 55%, #ece0c6 100%);
    background-attachment: fixed;
    color: var(--ink);
    margin: 0;
    padding: 16px;
    min-height: 100vh;
  }
  .wrap { max-width: 820px; margin: 0 auto; }
  h1 {
    font-family: "Shippori Mincho", serif;
    font-size: 24px; font-weight: 800; margin: 0 0 4px; letter-spacing: 0.02em;
  }
  .subtitle { font-size: 12px; color: var(--sub); margin-bottom: 18px; }
  .tabs { display: flex; gap: 4px; border-bottom: 2px solid var(--border); margin-bottom: 18px; flex-wrap: wrap; }
  .tab {
    padding: 8px 14px; cursor: pointer; font-weight: 700; font-size: 14px;
    color: var(--sub); border-bottom: 3px solid transparent; margin-bottom: -2px;
    transition: color 0.15s;
  }
  .tab.active { color: var(--ink); border-bottom-color: var(--accent); }
  .panel { display: none; }
  .panel.active { display: block; }
  textarea, input[type=text] {
    width: 100%; font-family: inherit; font-size: 13px; padding: 9px 10px;
    border: 1px solid var(--border); border-radius: 7px; background: #fffdf9; color: var(--ink);
  }
  textarea { min-height: 160px; resize: vertical; }
  button {
    font-family: inherit; font-size: 13px; font-weight: 700; padding: 8px 16px;
    border-radius: 7px; border: 1px solid var(--accent); background: var(--accent); color: #fff;
    cursor: pointer; box-shadow: 0 1px 2px rgba(58,46,24,0.15);
  }
  button.secondary { background: #fff; color: var(--accent); box-shadow: none; }
  button:disabled { opacity: 0.5; cursor: default; }
  .card {
    background: #fffdf9;
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px 18px;
    margin-bottom: 12px;
    box-shadow: 0 2px 6px rgba(58,46,24,0.06), 0 1px 2px rgba(58,46,24,0.05);
  }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .row > * { margin: 0; }
  label { font-size: 12px; color: var(--sub); display: block; margin-bottom: 4px; }
  .small { font-size: 12px; color: var(--sub); }
  .board-table {
    border-collapse: collapse;
    box-shadow: 0 2px 8px rgba(58,46,24,0.10);
    border-radius: 4px;
  }
  .board-table td {
    width: 30px; height: 32px; border: 1px solid var(--board-line);
    background: var(--board-bg); text-align: center; font-size: 15px; font-weight: 700;
    font-family: serif;
  }
  .board-table .label { border: none; background: transparent; font-size: 11px; color: var(--sub); width: 20px; box-shadow: none; }
  .gote-piece { color: var(--lose); transform: rotate(180deg); display: inline-block; }
  .edge-item {
    display: flex; justify-content: space-between; align-items: center; padding: 9px 14px;
    border-radius: 7px; background: #fffdf9; border: 1px solid var(--border); cursor: pointer;
    margin-bottom: 6px; box-shadow: 0 1px 3px rgba(58,46,24,0.05);
    transition: box-shadow 0.15s;
  }
  .edge-item:hover { box-shadow: 0 2px 6px rgba(58,46,24,0.10); }
  .edge-item.disabled { background: #f0ede4; cursor: default; box-shadow: none; }
  .edge-move { font-weight: 700; color: var(--ink); }
  .edge-stat { font-size: 12px; color: #777; }
  table.data { border-collapse: collapse; width: 100%; font-size: 12px; }
  table.data th { background: var(--accent); color: #fff; padding: 6px 8px; text-align: left; }
  table.data td { padding: 6px 8px; border-bottom: 1px solid var(--border); }
  .bar-bg { background: #eee0c0; border-radius: 4px; height: 10px; overflow: hidden; }
  .bar-fill { background: var(--accent); height: 100%; }
  .crumb { font-size: 13px; color: var(--sub); line-height: 1.8; margin-bottom: 10px; }
  .crumb a { color: var(--accent); cursor: pointer; font-weight: 600; text-decoration: none; }
  .flex-gap { display: flex; gap: 24px; flex-wrap: wrap; }
  .hint { font-size: 11px; color: #aaa; margin-top: 4px; }
  .warn { background: #fbeee6; border: 1px solid #e3b898; color: #8a4a2e; padding: 8px 12px; border-radius: 6px; font-size: 12px; margin-bottom: 8px; }
  .star-btn { font-size: 20px; background: none; border: 1px solid var(--border); border-radius: 6px; padding: 4px 10px; cursor: pointer; color: #c9c0a8; }
  .star-btn.on { color: #c9a227; }
</style>
</head>
<body>
<div class="wrap">
  <h1>将棋 局面分析ツール</h1>
  <div class="subtitle" id="summaryLine">読み込み中...</div>

  <div class="tabs">
    <div class="tab active" data-tab="import">棋譜を追加</div>
    <div class="tab" data-tab="tree">局面ツリー</div>
    <div class="tab" data-tab="search">局面検索</div>
    <div class="tab" data-tab="bookmarks">ブックマーク</div>
    <div class="tab" data-tab="dash">成績ダッシュボード</div>
    <div class="tab" data-tab="settings">設定</div>
  </div>

  <div class="panel active" id="panel-import"></div>
  <div class="panel" id="panel-tree"></div>
  <div class="panel" id="panel-search"></div>
  <div class="panel" id="panel-bookmarks"></div>
  <div class="panel" id="panel-dash"></div>
  <div class="panel" id="panel-settings"></div>
</div>

<script>
/* =========================================================
   将棋 局面分析ツール - 単体HTML版
   データはすべてブラウザのlocalStorageに保存される(サーバー送信なし)
   ========================================================= */

/* ---------- 定数 ---------- */
const ZEN2INT = {}; "１２３４５６７８９".split("").forEach((c,i)=>ZEN2INT[c]=i+1);
const KAN2INT = {}; "一二三四五六七八九".split("").forEach((c,i)=>KAN2INT[c]=i+1);
const PIECE_CODE = {"歩":"P","香":"L","桂":"N","銀":"S","金":"G","角":"B","飛":"R","玉":"K","王":"K","と":"t","成香":"l","成桂":"n","成銀":"s","馬":"b","龍":"r","竜":"r"};
const CODE_TO_JP = {P:"歩",L:"香",N:"桂",S:"銀",G:"金",B:"角",R:"飛",K:"玉",t:"と",l:"杏",n:"圭",s:"全",b:"馬",r:"龍"};
const BASE_OF_PROMOTED = {"と":"歩","成香":"香","成桂":"桂","成銀":"銀","馬":"角","龍":"飛","竜":"飛"};
const HAND_ORDER = ["R","B","G","S","N","L","P"];
const FILES = [9,8,7,6,5,4,3,2,1];
const RANKS = ["一","二","三","四","五","六","七","八","九"];
const KAIKEI_HINTS = ["対矢倉","対雁木","相掛かり","横歩取り","角換わり45桂馬","角換わり相腰掛け銀","角換わり相早繰り銀",
  "対角換わり早繰り銀","対角換わり棒銀","対角換わり45桂","対筋違い角","対嬉野流","四間飛車対穴熊","四間飛車対棒銀",
  "四間飛車対位取り","四間飛車対ミレニアム","四間飛車対45歩","四間飛車対その他","kkf","対向い飛車","対kkf",
  "対三間飛車急戦","対三間飛車持久戦","対四間飛車急戦","対四間飛車持久戦","対中飛車急戦","対中飛車持久戦"];

const MOVE_RE = /^([１２３４５６７８９])([一二三四五六七八九])(成香|成桂|成銀|歩|香|桂|銀|金|角|飛|玉|王|と|馬|龍|竜)(成)?(打)?(?:\((\d)(\d)\))?$/;

/* ---------- localStorage helpers ---------- */
const LS_GAMES = "shogi_tool_games";
const LS_MYNAMES = "shogi_tool_mynames";
const LS_NOTES = "shogi_tool_notes";

function loadGames() { try { return JSON.parse(localStorage.getItem(LS_GAMES)) || []; } catch(e) { return []; } }
function saveGames(games) { localStorage.setItem(LS_GAMES, JSON.stringify(games)); }
function loadMyNames() { try { return JSON.parse(localStorage.getItem(LS_MYNAMES)) || []; } catch(e) { return []; } }
function saveMyNames(names) { localStorage.setItem(LS_MYNAMES, JSON.stringify(names)); }
function loadNotes() { try { return JSON.parse(localStorage.getItem(LS_NOTES)) || {}; } catch(e) { return {}; } }
function saveNotes(notes) { localStorage.setItem(LS_NOTES, JSON.stringify(notes)); }

/* ---------- 棋譜パーサー ---------- */
function parseMoveToken(tok) {
  const m = MOVE_RE.exec(tok);
  if (!m) return null;
  const col = ZEN2INT[m[1]];
  const row = KAN2INT[m[2]];
  const piece = m[3];
  const promote = !!m[4];
  const drop = !!m[5];
  const from = m[6] ? [parseInt(m[6],10), parseInt(m[7],10)] : null;
  return { to: [col,row], piece, promote, drop, from };
}

function initialBoard() {
  const board = {};
  const back = ["香","桂","銀","金","玉","金","銀","桂","香"];
  for (let i=0;i<9;i++) {
    const col = i+1;
    board[col+","+1] = ["G", back[i]];
    board[col+","+9] = ["S", back[i]];
  }
  board["8,2"] = ["G","飛"];
  board["2,2"] = ["G","角"];
  board["2,8"] = ["S","飛"];
  board["8,8"] = ["S","角"];
  for (let col=1; col<=9; col++) {
    board[col+",3"] = ["G","歩"];
    board[col+",7"] = ["S","歩"];
  }
  return board;
}

function cloneBoard(board) { const b={}; for (const k in board) b[k]=board[k].slice(); return b; }
function cloneHands(hands) { return { S: Object.assign({},hands.S), G: Object.assign({},hands.G) }; }

function encodeState(board, hands, turn) {
  // 81*2文字の盤面文字列 + 持ち駒 + 手番
  let s = "";
  for (let r=1;r<=9;r++) {
    for (let c=1;c<=9;c++) {
      const cell = board[c+","+r];
      if (!cell) { s += ".."; }
      else { s += cell[0] + PIECE_CODE[cell[1]]; }
    }
  }
  const handStr = (h) => HAND_ORDER.filter(k=>h[k]).map(k=>k+h[k]).join(",");
  return s + "|" + handStr(hands.S) + "|" + handStr(hands.G) + "|" + turn;
}

function applyMove(board, hands, turn, mv) {
  const opp = turn === "S" ? "G" : "S";
  const toKey = mv.to[0] + "," + mv.to[1];
  if (mv.drop) {
    const code = PIECE_CODE[mv.piece];
    hands[turn][code] = (hands[turn][code]||0) - 1;
    if (hands[turn][code] <= 0) delete hands[turn][code];
    board[toKey] = [turn, mv.piece];
  } else {
    const fromKey = mv.from[0] + "," + mv.from[1];
    if (board[toKey]) {
      const cap = board[toKey][1];
      const base = BASE_OF_PROMOTED[cap] || cap;
      const code = PIECE_CODE[base];
      hands[turn][code] = (hands[turn][code]||0) + 1;
      delete board[toKey];
    }
    delete board[fromKey];
    board[toKey] = [turn, mv.piece];
  }
}

function simulateGame(moveTokens) {
  let board = initialBoard();
  let hands = { S:{}, G:{} };
  let turn = "S";
  const trace = [];
  for (const tok of moveTokens) {
    const mv = parseMoveToken(tok);
    if (!mv) continue;
    const before = encodeState(board, hands, turn);
    const snap = { board: cloneBoard(board), hands: cloneHands(hands), turn };
    trace.push({ before, move: tok, side: turn, snap });
    applyMove(board, hands, turn, mv);
    turn = turn === "S" ? "G" : "S";
  }
  return trace;
}

/* ---------- 棋譜テキストのヘッダー抽出・分割 ---------- */
function splitBlocks(rawText) {
  const parts = rawText.split(/(?=開始日時[:：])/).map(s=>s.trim()).filter(Boolean);
  return parts.filter(p => /開始日時[:：]/.test(p));
}

function extractField(text, label) {
  const re = new RegExp(label + "[:：]\\s*(\\S+)");
  const m = re.exec(text);
  return m ? m[1] : null;
}

function parseBlock(text) {
  const startTimeMatch = /開始日時[:：]\s*(\S+\s+\S+)/.exec(text);
  const startTime = startTimeMatch ? startTimeMatch[1] : null;
  const sente = extractField(text, "先手");
  const gote = extractField(text, "後手");
  let jikanRaw = extractField(text, "持ち時間");
  let jikan = jikanRaw;
  if (jikanRaw === "0分") {
    const byoyomi = extractField(text, "秒読み");
    if (byoyomi) jikan = "0分秒読み" + byoyomi;
  }
  // 指し手行の抽出: "N 指し手  (時間)" 形式。投了/中断/千日手等で終端。
  const lines = text.split("\n").map(l=>l.trim()).filter(Boolean);
  const moveTokens = [];
  let resignMoveNum = null;
  let endReason = null;
  const lineRe = /^(\d+)\s+(\S+)\s*(?:\(|$)/;
  for (const line of lines) {
    const m = lineRe.exec(line);
    if (!m) continue;
    const num = parseInt(m[1],10);
    const tok = m[2];
    if (tok === "投了" || tok === "中断" || tok === "千日手" || tok === "持将棋" || tok === "切れ負け") {
      resignMoveNum = num;
      endReason = tok;
      break;
    }
    moveTokens.push(tok);
  }
  return { startTime, sente, gote, jikan, moveTokens, resignMoveNum, endReason };
}

/* ---------- 勝敗・手番の判定 ---------- */
function computeResult(parsed, myNames) {
  const isMe = (name) => myNames.some(n => n && n.trim() === (name||"").trim());
  let tktSide = null;
  if (isMe(parsed.sente)) tktSide = "S";
  else if (isMe(parsed.gote)) tktSide = "G";
  let result = null;
  if (tktSide && parsed.resignMoveNum != null && parsed.endReason === "投了") {
    const senteResigned = (parsed.resignMoveNum % 2 === 1); // 奇数手=先手番の投了
    if (tktSide === "S") result = senteResigned ? "lose" : "win";
    else result = senteResigned ? "win" : "lose";
  }
  return { tktSide, result };
}

/* ---------- 体験期間管理 ---------- */
// 固定日付方式: この日付を過ぎたらロックする(日本時間 2026/10/01 0:00)
const CUTOFF_DATE = new Date("2026-10-01T00:00:00+09:00");

function daysRemaining() {
  const diffMs = CUTOFF_DATE - new Date();
  return Math.max(0, Math.ceil(diffMs / (1000*60*60*24)));
}
function isLocked() {
  return new Date() >= CUTOFF_DATE;
}
function exportBackupJSON() {
  const data = { games: GAMES, myNames: MYNAMES, notes: NOTES };
  const blob = new Blob([JSON.stringify(data, null, 1)], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = "shogi_tool_backup.json"; a.click();
  URL.revokeObjectURL(url);
}
function renderLockScreen() {
  document.querySelector(".tabs").style.display = "none";
  document.querySelectorAll(".panel").forEach(p => p.style.display = "none");
  const wrap = document.querySelector(".wrap");
  const lockDiv = document.createElement("div");
  lockDiv.className = "card";
  lockDiv.innerHTML = `
    <div style="font-weight:800; font-size:16px; margin-bottom:8px;">体験期間が終了しました</div>
    <div class="small" style="margin-bottom:12px; line-height:1.6;">
      このツールの無料体験期間(〜2026/9/30)が終了した。<br>
      これまで登録したデータは、下のボタンから書き出して保存できる。<br>
      正式版(Web版)への移行についてはTKTDESUYOまで連絡してほしい。
    </div>
    <button id="btnLockExport">全データをJSONで書き出す</button>
  `;
  wrap.appendChild(lockDiv);
  document.getElementById("btnLockExport").onclick = exportBackupJSON;
}


let GAMES = loadGames();
let MYNAMES = loadMyNames();
let NOTES = loadNotes();
let pendingImports = []; // {parsed, tktSide, result, kaikei, dup}

let treeSide = "S";
let treePath = []; // [{move, hash}]

/* ---------- ツリー構築 ---------- */
function parseStartTimeToDate(startTime) {
  if (!startTime) return null;
  const m = /^(\d{4})\/(\d{1,2})\/(\d{1,2})\s+(\d{1,2}):(\d{1,2}):(\d{1,2})/.exec(startTime);
  if (!m) return null;
  return new Date(Number(m[1]), Number(m[2])-1, Number(m[3]), Number(m[4]), Number(m[5]), Number(m[6]));
}

function buildTrees() {
  const trees = { S: { root: null, nodes: {} }, G: { root: null, nodes: {} } };
  let rootHash = null;
  const now = new Date();
  const oneMonthAgo = new Date(now.getTime() - 30*24*60*60*1000);
  for (const g of GAMES) {
    if (!g.tktSide) continue;
    const trace = simulateGame(g.moveTokens);
    if (trace.length === 0) continue;
    if (rootHash === null) rootHash = trace[0].before;
    const tree = trees[g.tktSide];
    if (!tree.root) tree.root = trace[0].before;
    const win = g.result === "win" ? 1 : 0;
    const lose = g.result === "lose" ? 1 : 0;
    const gDate = parseStartTimeToDate(g.startTime);
    const isRecent = gDate && gDate >= oneMonthAgo;
    for (let i=0;i<trace.length;i++) {
      const step = trace[i];
      if (!tree.nodes[step.before]) tree.nodes[step.before] = { edges: {}, snap: step.snap };
      const node = tree.nodes[step.before];
      if (!node.edges[step.move]) node.edges[step.move] = { n:0, w:0, recentN:0, side: step.side, to: null };
      const e = node.edges[step.move];
      e.n += 1; e.w += win;
      if (isRecent) e.recentN += 1;
      if (i+1 < trace.length) e.to = trace[i+1].before;
    }
  }
  // 両ツリーとも同一の開始局面をルートにする
  if (rootHash) {
    for (const key of ["S","G"]) {
      if (!trees[key].root) trees[key].root = rootHash;
      if (!trees[key].nodes[rootHash]) {
        const board = initialBoard();
        trees[key].nodes[rootHash] = { edges: {}, snap: { board, hands:{S:{},G:{}}, turn:"S" } };
      }
    }
  }
  return trees;
}

function computeStudyRecommendations() {
  const trees = buildTrees();
  const result = {};
  ["S","G"].forEach(sk => {
    const tree = trees[sk];
    const allEdges = [];
    for (const hash in tree.nodes) {
      const node = tree.nodes[hash];
      for (const move in node.edges) {
        const e = node.edges[move];
        allEdges.push({ hash, move, n:e.n, w:e.w, recentN:e.recentN, rate: e.n>0?(e.w/e.n):0 });
      }
    }
    const byRecent = allEdges.filter(e=>e.recentN>0).sort((a,b)=>b.recentN-a.recentN).slice(0,3);
    const byBest = allEdges.filter(e=>e.n>=5).sort((a,b)=>b.rate-a.rate).slice(0,3);
    const byWorst = allEdges.filter(e=>e.n>=5).sort((a,b)=>a.rate-b.rate).slice(0,3);
    result[sk] = { recent: byRecent, best: byBest, worst: byWorst };
  });
  return result;
}

function bfsPath(tree, targetHash) {
  if (targetHash === tree.root) return [];
  const visited = new Set([tree.root]);
  const queue = [{ hash: tree.root, path: [] }];
  while (queue.length) {
    const { hash, path } = queue.shift();
    const node = tree.nodes[hash];
    if (!node) continue;
    for (const move in node.edges) {
      const e = node.edges[move];
      if (!e.to || visited.has(e.to)) continue;
      const newPath = path.concat([{ move, hash: e.to }]);
      if (e.to === targetHash) return newPath;
      visited.add(e.to);
      queue.push({ hash: e.to, path: newPath });
    }
  }
  return null;
}

/* ---------- 盤面レンダリング ---------- */
function renderBoardHTML(snap) {
  const renderHand = (side) => {
    const h = snap.hands[side] || {};
    const parts = HAND_ORDER.filter(k=>h[k]).map(k=>CODE_TO_JP[k] + (h[k]>1 ? "×"+h[k] : ""));
    return parts.length ? parts.join(" ") : "なし";
  };
  let html = `<div style="display:inline-block;">`;
  html += `<div class="small" style="margin-bottom:4px;">後手 持駒: ${renderHand("G")}</div>`;
  html += `<table class="board-table"><tr><td class="label"></td>`;
  FILES.forEach(f => html += `<td class="label">${f}</td>`);
  html += `</tr>`;
  for (let ri=0; ri<9; ri++) {
    const row = ri+1;
    html += `<tr><td class="label">${RANKS[ri]}</td>`;
    FILES.forEach(col => {
      const cell = snap.board[col+","+row];
      if (!cell) { html += `<td></td>`; }
      else {
        const [owner, piece] = cell;
        if (owner === "G") html += `<td><span class="gote-piece">${piece}</span></td>`;
        else html += `<td>${piece}</td>`;
      }
    });
    html += `</tr>`;
  }
  html += `</table>`;
  html += `<div class="small" style="margin-top:4px;">先手 持駒: ${renderHand("S")}</div>`;
  html += `</div>`;
  return html;
}

/* ---------- タブ: 棋譜を追加 ---------- */
function renderImportTab() {
  const el = document.getElementById("panel-import");
  const myNamesSet = MYNAMES.length > 0;
  el.innerHTML = `
    <div class="card">
      ${!myNamesSet ? `<div class="warn">先に「設定」タブで自分の将棋ウォーズID(複数可)を登録してほしい。勝敗の自動判定に使う。</div>` : ""}
      <label>将棋ウォーズの棋譜をそのまま貼り付け(複数局まとめてOK。「開始日時：」区切りで自動分割)</label>
      <textarea id="importText" placeholder="開始日時：2026/... の行から始まる棋譜をここに貼り付け"></textarea>
      <div style="margin-top:8px;">
        <button id="btnParse">読み込む</button>
      </div>
    </div>
    <div id="importPreview"></div>
  `;
  document.getElementById("btnParse").onclick = () => {
    const text = document.getElementById("importText").value;
    const blocks = splitBlocks(text);
    if (blocks.length === 0) {
      document.getElementById("importPreview").innerHTML = `<div class="warn">「開始日時：」を含む棋譜ブロックが見つからなかった。将棋ウォーズの棋譜をそのまま貼り付けてほしい。</div>`;
      return;
    }
    const seenInBatch = new Set();
    pendingImports = blocks.map(b => {
      const parsed = parseBlock(b);
      const { tktSide, result } = computeResult(parsed, MYNAMES);
      const inStorage = GAMES.some(g => g.startTime === parsed.startTime);
      const inBatch = parsed.startTime && seenInBatch.has(parsed.startTime);
      const dup = inStorage || inBatch;
      if (parsed.startTime) seenInBatch.add(parsed.startTime);
      return { parsed, tktSide, result, kaikei: "", dup };
    });
    renderImportPreview();
  };
}

function renderImportPreview() {
  const box = document.getElementById("importPreview");
  if (pendingImports.length === 0) { box.innerHTML = ""; return; }
  let html = `<div class="card"><div class="small" style="margin-bottom:8px;">${pendingImports.length}局検出。戦型タグを入力して「保存」を押してほしい(空欄でも保存可、後から変更可)。</div>`;
  pendingImports.forEach((item, idx) => {
    const p = item.parsed;
    if (item.dup) {
      html += `<div class="row" style="margin-bottom:8px; opacity:0.6;">
        <span class="small">${p.startTime} ${p.sente} vs ${p.gote} → <b>重複(既存データにあり・スキップ)</b></span>
      </div>`;
      return;
    }
    const sideLabel = item.tktSide === "S" ? "先手" : item.tktSide === "G" ? "後手" : "不明(自分のIDに一致せず)";
    const resultLabel = item.result === "win" ? "勝ち" : item.result === "lose" ? "負け" : "判定不可";
    const resultColor = item.result === "win" ? "var(--win)" : item.result === "lose" ? "var(--lose)" : "#999";
    html += `<div class="row" style="margin-bottom:8px; border-bottom:1px solid var(--border); padding-bottom:8px;">
      <div style="flex:1; min-width:220px;">
        <div class="small">${p.startTime || "(日時不明)"} ｜ ${p.sente || "?"} vs ${p.gote || "?"} ｜ ${p.jikan || ""}</div>
        <div class="small">先後: ${sideLabel} ／ 結果: <b style="color:${resultColor};">${resultLabel}</b> ／ 手数: ${p.moveTokens.length}${p.endReason ? "("+p.endReason+")" : "(終局未検出)"}</div>
      </div>
      <input type="text" list="kaikeiHints" placeholder="戦型タグ(任意)" style="width:200px;" data-idx="${idx}" class="kaikeiInput">
    </div>`;
  });
  html += `<datalist id="kaikeiHints">${KAIKEI_HINTS.map(k=>`<option value="${k}">`).join("")}</datalist>`;
  html += `<button id="btnSaveImports">この内容で保存</button></div>`;
  box.innerHTML = html;
  box.querySelectorAll(".kaikeiInput").forEach(inp => {
    inp.oninput = (e) => { pendingImports[e.target.dataset.idx].kaikei = e.target.value; };
  });
  document.getElementById("btnSaveImports").onclick = () => {
    let added = 0;
    pendingImports.forEach(item => {
      if (item.dup) return;
      const p = item.parsed;
      GAMES.push({
        id: Date.now() + Math.random(),
        startTime: p.startTime, sente: p.sente, gote: p.gote, jikan: p.jikan,
        moveTokens: p.moveTokens, tktSide: item.tktSide, result: item.result,
        kaikei: item.kaikei || "(未分類)", movesCount: p.moveTokens.length,
      });
      added++;
    });
    saveGames(GAMES);
    pendingImports = [];
    document.getElementById("importText").value = "";
    document.getElementById("importPreview").innerHTML = `<div class="card">${added}局を保存した。</div>`;
    updateSummaryLine();
  };
}

/* ---------- タブ: 局面ツリー ---------- */
function renderTreeTab() {
  const el = document.getElementById("panel-tree");
  const trees = buildTrees();
  const tree = trees[treeSide];
  if (!tree.root) {
    el.innerHTML = `<div class="small">まだ有効な棋譜データがない。「棋譜を追加」タブから登録してほしい。</div>`;
    return;
  }
  const currentHash = treePath.length ? treePath[treePath.length-1].hash : tree.root;
  const node = tree.nodes[currentHash];
  const edges = node ? Object.entries(node.edges).sort((a,b)=>b[1].n-a[1].n) : [];

  const noteKey = treeSide + ":" + currentHash;
  const current = NOTES[noteKey] || { starred:false, note:"" };

  let html = `<div class="row" style="margin-bottom:12px;">
    <button class="${treeSide==='S'?'':'secondary'}" id="btnSideS">先手番ツリー</button>
    <button class="${treeSide==='G'?'':'secondary'}" id="btnSideG">後手番ツリー</button>
  </div>`;
  html += `<div class="crumb"><a id="crumbRoot">開始局面</a>`;
  treePath.forEach((p,i) => { html += ` &gt; <a class="crumbLink" data-idx="${i+1}">${p.move}</a>`; });
  html += `</div>`;
  html += `<div class="flex-gap"><div>`;
  html += renderBoardHTML(node.snap);
  html += `<div class="row" style="margin-top:10px;">
    <button class="star-btn ${current.starred?'on':''}" id="btnStar">${current.starred?'★':'☆'}</button>
    <span class="small">${current.starred?'ブックマーク済み':'ブックマークする'}</span>
  </div>`;
  html += `<textarea id="noteBox" placeholder="この局面の研究メモ(フォーカスを外すと自動保存)" style="margin-top:8px; width:260px; min-height:70px;">${current.note||""}</textarea>`;
  html += `<div style="margin-top:8px;"><button class="secondary" id="btnToKenkyu">この局面を研究サイトで開く</button></div>`;
  html += `</div>`;
  html += `<div style="min-width:220px; flex:1;">`;
  html += `<div class="small" style="font-weight:700; margin-bottom:6px;">この局面から指された手 (${edges.length}種)</div>`;
  if (edges.length === 0) html += `<div class="small">これ以上のデータはありません(対局終了点)</div>`;
  edges.forEach(([move, e]) => {
    const rate = e.n>0 ? Math.round((e.w/e.n)*100) : 0;
    html += `<div class="edge-item ${e.to?'':'disabled'}" data-move="${move}">
      <span class="edge-move">${move}</span>
      <span class="edge-stat">${e.n}局 勝率${rate}%（${e.w}勝${e.n-e.w}敗）</span>
    </div>`;
  });
  html += `</div></div>`;
  el.innerHTML = html;

  document.getElementById("btnSideS").onclick = () => { treeSide="S"; treePath=[]; renderTreeTab(); };
  document.getElementById("btnSideG").onclick = () => { treeSide="G"; treePath=[]; renderTreeTab(); };
  document.getElementById("crumbRoot").onclick = () => { treePath=[]; renderTreeTab(); };
  el.querySelectorAll(".crumbLink").forEach(a => {
    a.onclick = () => { treePath = treePath.slice(0, parseInt(a.dataset.idx,10)); renderTreeTab(); };
  });
  el.querySelectorAll(".edge-item").forEach(item => {
    item.onclick = () => {
      const move = item.dataset.move;
      const e = node.edges[move];
      if (!e.to) return;
      treePath = treePath.concat([{ move, hash: e.to }]);
      renderTreeTab();
    };
  });
  document.getElementById("btnStar").onclick = () => {
    NOTES[noteKey] = Object.assign({}, current, { starred: !current.starred, updatedAt: new Date().toISOString() });
    saveNotes(NOTES);
    renderTreeTab();
  };
  document.getElementById("noteBox").onblur = (e) => {
    NOTES[noteKey] = Object.assign({}, NOTES[noteKey]||{starred:false}, { note: e.target.value, updatedAt: new Date().toISOString() });
    saveNotes(NOTES);
  };
  document.getElementById("btnToKenkyu").onclick = () => {
    const pathLabel = treePath.map(p=>p.move).join(" ");
    const sourceNote = `サイト1(${treeSide==='S'?'先手番':'後手番'}ツリー${pathLabel?": "+pathLabel:""})より`;
    try {
      localStorage.setItem("shogi_handoff", JSON.stringify({ board: node.snap.board, hands: node.snap.hands, turn: node.snap.turn, sourceNote }));
      location.href = "kenkyu.html";
    } catch (e) {
      alert("研究サイトへの連携に失敗した。");
    }
  };
}

/* ---------- タブ: 局面検索 ---------- */
function renderSearchTab() {
  const el = document.getElementById("panel-search");
  el.innerHTML = `
    <div class="row" style="margin-bottom:16px;">
      <select id="searchTreeSel">
        <option value="both">両ツリー</option>
        <option value="S">先手ツリー</option>
        <option value="G">後手ツリー</option>
      </select>
      <label style="display:inline; margin:0;">局数<input type="number" id="searchMinN" value="2" min="1" style="width:60px; display:inline-block;" onfocus="this.select()">局以上</label>
      <select id="searchRateOp">
        <option value="gte">勝率 以上</option>
        <option value="lt">勝率 未満</option>
      </select>
      <input type="number" id="searchRateVal" placeholder="未指定" min="0" max="100" style="width:70px;" onfocus="this.select()">%
      <button id="btnSearch">検索</button>
    </div>
    <div id="searchResults" class="small">条件を指定して検索してほしい。</div>
  `;
  document.getElementById("btnSearch").onclick = () => {
    const trees = buildTrees();
    const treeSel = document.getElementById("searchTreeSel").value;
    const minN = parseInt(document.getElementById("searchMinN").value,10) || 1;
    const rateOp = document.getElementById("searchRateOp").value;
    const rateValRaw = document.getElementById("searchRateVal").value;
    const rateVal = rateValRaw === "" ? null : parseInt(rateValRaw,10);
    const sides = treeSel === "both" ? ["S","G"] : [treeSel];
    const results = [];
    sides.forEach(sk => {
      const tree = trees[sk];
      for (const hash in tree.nodes) {
        const node = tree.nodes[hash];
        for (const move in node.edges) {
          const e = node.edges[move];
          if (e.n < minN) continue;
          const rate = e.n>0 ? (e.w/e.n)*100 : 0;
          if (rateVal !== null) {
            if (rateOp==="gte" && rate<rateVal) continue;
            if (rateOp==="lt" && rate>=rateVal) continue;
          }
          results.push({ sk, hash, move, n:e.n, w:e.w, rate:Math.round(rate), mover:e.side });
        }
      }
    });
    results.sort((a,b)=> b.n-a.n || b.rate-a.rate);
    const box = document.getElementById("searchResults");
    if (results.length===0) { box.innerHTML = `<div class="small">該当なし。</div>`; return; }
    let html = `<div class="small" style="margin-bottom:8px;">${results.length}件ヒット(最大100件表示)</div>`;
    results.slice(0,100).forEach((r,i) => {
      html += `<div class="edge-item" data-sk="${r.sk}" data-hash="${r.hash}">
        <span><span class="small" style="margin-right:8px;">${r.sk==='S'?'先手ツリー':'後手ツリー'} / ${r.mover==='S'?'先手が指す':'後手が指す'}</span><span class="edge-move">${r.move}</span></span>
        <span class="edge-stat">${r.n}局 勝率${r.rate}%（${r.w}勝${r.n-r.w}敗）</span>
      </div>`;
    });
    box.innerHTML = html;
    box.querySelectorAll(".edge-item").forEach(item => {
      item.onclick = () => jumpTo(item.dataset.sk, item.dataset.hash);
    });
  };
}

function jumpTo(sk, hash) {
  const trees = buildTrees();
  const p = bfsPath(trees[sk], hash);
  treeSide = sk;
  treePath = p || [];
  switchTab("tree");
}

/* ---------- タブ: 成績ダッシュボード ---------- */
function renderDashboardTab() {
  const el = document.getElementById("panel-dash");
  const rows = GAMES.filter(g => g.tktSide && g.result);
  if (rows.length===0) {
    el.innerHTML = `<div class="small">まだ判定済みの棋譜データがない。</div>`;
    return;
  }
  const groupBy = (keyFn) => {
    const m = {};
    rows.forEach(r => {
      const k = keyFn(r);
      if (!m[k]) m[k] = {n:0,w:0};
      m[k].n += 1;
      if (r.result==="win") m[k].w += 1;
    });
    return m;
  };
  const byKaikei = groupBy(r=>r.kaikei||"(未分類)");
  const bySide = groupBy(r=>r.tktSide==="S"?"先手":"後手");
  const byJikan = groupBy(r=>r.jikan||"(不明)");
  const totalW = rows.filter(r=>r.result==="win").length;
  const totalN = rows.length;

  const barRow = (label, n, w) => {
    const rate = n>0 ? Math.round((w/n)*100) : 0;
    return `<div style="margin-bottom:8px;">
      <div class="row" style="justify-content:space-between; font-size:12px; margin-bottom:2px;">
        <span style="font-weight:600;">${label}</span>
        <span class="small">${w}勝${n-w}敗 (${rate}%) / ${n}局</span>
      </div>
      <div class="bar-bg"><div class="bar-fill" style="width:${rate}%;"></div></div>
    </div>`;
  };

  const study = computeStudyRecommendations();
  const studySection = (title, hint) => {
    let h = `<div style="flex:1; min-width:260px;">
      <div style="font-weight:700; margin-bottom:2px;">${title}</div>
      <div class="small" style="margin-bottom:8px;">${hint}</div>`;
    ["S","G"].forEach(sk => {
      const list = title.includes("直近") ? study[sk].recent : title.includes("勝率が高") ? study[sk].best : study[sk].worst;
      h += `<div class="small" style="font-weight:700; margin:6px 0 4px;">${sk==='S'?'先手':'後手'}</div>`;
      if (list.length===0) { h += `<div class="small" style="color:var(--sub);">該当なし</div>`; }
      list.forEach(item => {
        const rate = Math.round(item.rate*100);
        h += `<div class="edge-item" data-studysk="${sk}" data-studyhash="${item.hash}">
          <span class="edge-move">${item.move}</span>
          <span class="small">${title.includes("直近") ? `直近${item.recentN}回` : `${rate}% (${item.n}局)`}</span>
        </div>`;
      });
    });
    h += `</div>`;
    return h;
  };
  let html = `<div class="card">
    <div style="font-weight:800; font-family:'Shippori Mincho',serif; font-size:16px; margin-bottom:2px;">勉強推奨局面</div>
    <div class="small" style="margin-bottom:10px;">タップするとその局面のツリーに移動する</div>
    <div class="flex-gap">
      ${studySection("直近1ヶ月で多い局面", "この1ヶ月で繰り返し出現(先後別TOP3)")}
      ${studySection("勝率が高い局面", "5局以上出現・得意な局面(先後別TOP3)")}
      ${studySection("勝率が低い局面", "5局以上出現・苦手な局面、要復習(先後別TOP3)")}
    </div>
  </div>`;
  html += `<div class="card" style="display:inline-block;">
    <div class="small">総合成績</div>
    <div style="font-size:22px; font-weight:800;">${totalW}勝${totalN-totalW}敗</div>
    <div class="small">勝率 ${Math.round((totalW/totalN)*100)}%</div>
  </div>`;
  html += `<div class="flex-gap">`;
  html += `<div style="flex:1; min-width:260px;"><div style="font-weight:700; margin-bottom:8px;">戦型別</div>`;
  Object.entries(byKaikei).sort((a,b)=>b[1].n-a[1].n).forEach(([k,v])=> html += barRow(k,v.n,v.w));
  html += `</div>`;
  html += `<div style="flex:1; min-width:260px;"><div style="font-weight:700; margin-bottom:8px;">先後別</div>`;
  Object.entries(bySide).forEach(([k,v])=> html += barRow(k,v.n,v.w));
  html += `<div style="font-weight:700; margin-top:16px; margin-bottom:8px;">持ち時間別</div>`;
  Object.entries(byJikan).forEach(([k,v])=> html += barRow(k,v.n,v.w));
  html += `</div></div>`;

  html += `<div style="margin-top:24px;"><div style="font-weight:700; margin-bottom:8px;">対局一覧</div>`;
  html += `<div style="overflow-x:auto;"><table class="data"><thead><tr>
    <th>日時</th><th>先後</th><th>相手</th><th>戦型</th><th>持ち時間</th><th>結果</th><th></th>
  </tr></thead><tbody>`;
  GAMES.forEach(r => {
    const resultLabel = r.result==="win" ? "勝ち" : r.result==="lose" ? "負け" : "不明";
    const resultColor = r.result==="win" ? "var(--win)" : r.result==="lose" ? "var(--lose)" : "#999";
    const opponent = r.tktSide==="S" ? r.gote : r.tktSide==="G" ? r.sente : (r.sente+"/"+r.gote);
    html += `<tr>
      <td>${r.startTime||""}</td>
      <td>${r.tktSide==="S"?"先手":r.tktSide==="G"?"後手":"?"}</td>
      <td>${opponent}</td>
      <td>${r.kaikei||""}</td>
      <td>${r.jikan||""}</td>
      <td style="color:${resultColor}; font-weight:700;">${resultLabel}</td>
      <td><button class="secondary" data-delid="${r.id}" style="padding:2px 8px; font-size:11px;">削除</button></td>
    </tr>`;
  });
  html += `</tbody></table></div></div>`;
  el.innerHTML = html;
  el.querySelectorAll("[data-studyhash]").forEach(item => {
    item.onclick = () => jumpTo(item.dataset.studysk, item.dataset.studyhash);
  });
  el.querySelectorAll("[data-delid]").forEach(btn => {
    btn.onclick = () => {
      if (!confirm("この対局データを削除する?")) return;
      GAMES = GAMES.filter(g => String(g.id) !== btn.dataset.delid);
      saveGames(GAMES);
      renderDashboardTab();
      updateSummaryLine();
    };
  });
}

        renderSettingsTab();
      } catch (err) {
        alert("読み込みに失敗した: " + err.message);
      }
    };
    reader.readAsText(file);
  };

  document.getElementById("btnCheckDup").onclick = () => {
    const groups = {};
    GAMES.forEach(g => {
      const key = g.startTime || "(日時不明)";
      if (!groups[key]) groups[key] = [];
      groups[key].push(g);
    });
    const dupGroups = Object.entries(groups).filter(([, list]) => list.length > 1);
    const box = document.getElementById("dupResult");
    if (dupGroups.length === 0) {
      box.innerHTML = `<div class="tip">重複は見つからなかった。</div>`;
      return;
    }
    let html = `<div class="warn">${dupGroups.length}件の開始日時で重複が見つかった。それぞれ1件だけ残して削除できる。</div>`;
    dupGroups.forEach(([key, list]) => {
      html += `<div class="edge-item" style="flex-direction:column; align-items:flex-start; cursor:default;">
        <div class="small" style="font-weight:700;">${key} ｜ ${list[0].sente||"?"} vs ${list[0].gote||"?"} ｜ ${list.length}件重複</div>
        <button class="secondary" data-dupkey="${key}" style="margin-top:6px; padding:4px 10px; font-size:11px;">最初の1件だけ残して削除</button>
      </div>`;
    });
    box.innerHTML = html;
    box.querySelectorAll("[data-dupkey]").forEach(btn => {
      btn.onclick = () => {
        const key = btn.dataset.dupkey;
        if (!confirm(`「${key}」の重複分を削除する（1件だけ残す）。よろしいか?`)) return;
        let kept = false;
        GAMES = GAMES.filter(g => {
          const k = g.startTime || "(日時不明)";
          if (k !== key) return true;
          if (!kept) { kept = true; return true; }
          return false;
        });
        saveGames(GAMES);
        updateSummaryLine();
        document.getElementById("btnCheckDup").click();
      };
    });
  };
}

/* ---------- 共通 ---------- */
function updateSummaryLine() {
  const el = document.getElementById("summaryLine");
  const rows = GAMES.filter(g=>g.tktSide && g.result);
  const w = rows.filter(g=>g.result==="win").length;
  const remain = daysRemaining();
  el.textContent = `登録局数: ${GAMES.length}局${rows.length ? `（${w}勝${rows.length-w}敗）` : ""} ｜ 体験期間: 〜9/30(残り${remain}日)`;
}

function switchTab(name) {
  document.querySelectorAll(".tab").forEach(t => t.classList.toggle("active", t.dataset.tab===name));
  document.querySelectorAll(".panel").forEach(p => p.classList.toggle("active", p.id==="panel-"+name));
  if (name==="import") renderImportTab();
  if (name==="tree") renderTreeTab();
  if (name==="search") renderSearchTab();
  if (name==="bookmarks") renderBookmarksTab();
  if (name==="dash") renderDashboardTab();
  if (name==="settings") renderSettingsTab();
}

document.querySelectorAll(".tab").forEach(t => {
  t.onclick = () => switchTab(t.dataset.tab);
});

/* ---------- 初期化 ---------- */
if (isLocked()) {
  renderLockScreen();
} else {
  updateSummaryLine();
  renderImportTab();
}
</script>
</body>
</html>
