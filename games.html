<style>
:root{--bg:#faf6ee;--ink:#2b2118;--mute:#6b5b48;--card:#fff;--bd:#dccfb8;--accent:#b4442c;--bar:#dfeedd;--barbd:#9cc79a}
@media (prefers-color-scheme:dark){:root{--bg:#1f1b16;--ink:#f1e8da;--mute:#b6a78f;--card:#2a2520;--bd:#4a4034;--bar:#2c3a2b;--barbd:#4d6b4b}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Hiragino Sans","Yu Gothic",sans-serif;line-height:1.5}
header{background:var(--bar);border-bottom:2px solid var(--barbd);padding:10px 16px;display:flex;align-items:center;gap:12px}
header img{width:64px;height:auto;border-radius:12px;flex:none}
header h1{margin:0;font-size:22px}
header p{margin:2px 0 0;font-size:13px;color:var(--mute)}
.wrap{max-width:640px;margin:0 auto;padding:16px 14px 40px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:430px){.grid{grid-template-columns:1fr}}
a.card{display:block;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;text-decoration:none;color:inherit;box-shadow:2px 3px 0 rgba(0,0,0,.12)}
a.card:active{transform:translateY(1px)}
.thumb{display:flex;align-items:center;justify-content:center;height:92px;border-radius:8px;background:#f3ecd9;margin-bottom:8px;overflow:hidden}
.thumb svg{height:84px;width:auto}
.card h2{margin:0 0 2px;font-size:17px;text-decoration:underline}
.card p{margin:0;font-size:13px;color:var(--mute)}
.card .date{font-size:12px;color:var(--mute);margin-top:4px}
.badge{display:inline-block;background:#d12f2f;color:#fff;font-size:11px;font-weight:700;padding:1px 7px;border-radius:9px;margin-left:6px;vertical-align:middle}
footer{margin-top:24px;font-size:12px;color:var(--mute);text-align:center}
</style>
